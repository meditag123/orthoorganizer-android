name: Build OrthoOrganizer Android APK
# Rebuild after classic login layout restoration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout private app source
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.ORTHO_SOURCE_READ_TOKEN }}
        shell: bash
        run: |
          if [ -z "$PRIVATE_SOURCE_TOKEN" ]; then
            echo "::error::Add repository secret ORTHO_SOURCE_READ_TOKEN (fine-grained token, read-only Contents for orthoorganizer-source)."
            exit 1
          fi
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PRIVATE_SOURCE_TOKEN" | base64 -w0)" \
            clone --depth 1 https://github.com/meditag123/orthoorganizer-source.git app
          echo "Private source checked out; token is not stored in git remote URL."

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android runner
        working-directory: app
        run: flutter create --platforms=android --no-pub .

      - name: Configure Android Internet permission
        working-directory: app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in s:
              s = s.replace('<application', permission + '\n    <application', 1)
          p.write_text(s)
          assert permission in p.read_text()
          PY

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Restore original OrthoOrganizer launcher icon
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OrthoOrganizer-Android-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
